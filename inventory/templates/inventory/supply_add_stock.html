{% extends 'inventory/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card" style="border-top: 4px solid #48bb78;">
            <div class="card-header">
                <h4 class="mb-0"><i class="fas fa-plus-circle me-2" style="color:#48bb78;"></i>库存追加</h4>
            </div>
            <div class="card-body">
                <div class="alert alert-info mb-4">
                    <i class="fas fa-box me-2"></i>当前库存：<strong>{{ supply.quantity }} {{ supply.unit }}</strong>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label">追加数量</label>
                        <input type="number" name="quantity" class="form-control" min="1" required placeholder="请输入追加数量">
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'supply_list' %}" class="btn btn-outline-secondary">
                            <i class="fas fa-times me-1"></i>取消
                        </a>
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-check me-1"></i>确认追加
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
