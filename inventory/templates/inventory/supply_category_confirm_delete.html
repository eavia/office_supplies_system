{% extends 'inventory/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card" style="border-top: 4px solid #f56565;">
            <div class="card-header">
                <h4 class="mb-0"><i class="fas fa-exclamation-triangle me-2" style="color:#f56565;"></i>确认删除</h4>
            </div>
            <div class="card-body">
                <p class="mb-3">确定要删除类别 <strong style="color:#1a1f2e;">{{ category.name }}</strong> ({{ category.code }}) 吗？</p>
                <div class="alert alert-danger">
                    <i class="fas fa-exclamation-circle me-2"></i>此操作不可恢复！如果该类别下有办公用品，将无法删除。
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'supply_category_list' %}" class="btn btn-outline-secondary">
                            <i class="fas fa-times me-1"></i>取消
                        </a>
                        <button type="submit" class="btn btn-danger">
                            <i class="fas fa-trash me-1"></i>确认删除
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
