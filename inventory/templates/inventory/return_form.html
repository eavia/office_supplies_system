{% extends 'inventory/base.html' %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-undo me-2" style="color:#48bb78;"></i>{{ title }}</h5>
            </div>
            <div class="card-body">
                <form method="post" id="returnForm">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">关联出库单 <span class="text-danger">*</span></label>
                        <select name="stockout_order" id="id_stockout_order" class="form-select" required>
                            <option value="">请选择已审批的出库单</option>
                            {% for order in approved_orders %}
                            <option value="{{ order.pk }}" data-items='{{ order.available_items_json|safe }}'>
                                {{ order.record_no }} — {{ order.recipient }} — {{ order.created_at|date:"Y-m-d" }}（{{ order.get_items_summary }}）
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">归还物品 <span class="text-danger">*</span></label>
                        <select name="supply" id="id_supply" class="form-select" required>
                            <option value="">请先选择出库单</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">可归还数量</label>
                        <div id="available_qty" class="form-control-plaintext text-muted">—</div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">归还数量 <span class="text-danger">*</span></label>
                            <input type="number" name="quantity" class="form-control" min="1" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">归还人 <span class="text-danger">*</span></label>
                            <input type="text" name="returner" class="form-control" required placeholder="归还人姓名">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">归还日期 <span class="text-danger">*</span></label>
                            <input type="date" name="return_date" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">归还原因</label>
                        <textarea name="reason" class="form-control" rows="2" placeholder="可选"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-check me-1"></i>提交归还</button>
                    <a href="{% url 'return_list' %}" class="btn btn-secondary ms-2">取消</a>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var orderSelect = document.getElementById('id_stockout_order');
    var supplySelect = document.getElementById('id_supply');
    var qtyDisplay = document.getElementById('available_qty');
    
    orderSelect.addEventListener('change', function() {
        var opt = this.options[this.selectedIndex];
        supplySelect.innerHTML = '<option value="">请选择物品</option>';
        qtyDisplay.textContent = '—';

        if (!this.value) return;
        var itemsRaw = opt.getAttribute('data-items');
        if (!itemsRaw) return;

        try {
            var items = JSON.parse(itemsRaw);
        } catch (e) {
            return;
        }

        items.forEach(function(item) {
            var opt = document.createElement('option');
            opt.value = item.id;
            opt.textContent = item.name + '（可归还 ' + item.remaining + '）';
            opt.setAttribute('data-qty', item.remaining);
            supplySelect.appendChild(opt);
        });
    });

    supplySelect.addEventListener('change', function() {
        var opt = this.options[this.selectedIndex];
        if (opt && opt.value) {
            qtyDisplay.textContent = '可归还：' + (opt.getAttribute('data-qty') || '—');
        } else {
            qtyDisplay.textContent = '—';
        }
    });
});
</script>
{% endblock %}
