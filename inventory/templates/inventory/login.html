{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 物品仓储管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }

        body {
            background:
                radial-gradient(60rem 42rem at -8% -12%, rgba(10, 132, 255, 0.55), transparent 61%),
                radial-gradient(58rem 42rem at 110% 100%, rgba(94, 92, 230, 0.46), transparent 62%),
                linear-gradient(145deg, #101827, #253b70 55%, #3854a3);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.68);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border-radius: 28px;
            box-shadow: 0 28px 70px rgba(0, 0, 0, 0.26), inset 0 1px rgba(255, 255, 255, 0.72);
            padding: 44px;
            width: 100%;
            max-width: 430px;
            animation: cardEnter 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(14px) scale(0.985); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-icon {
            width: 76px;
            height: 76px;
            background: linear-gradient(135deg, #0a84ff, #5e5ce6);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 22px;
            color: white;
            font-size: 31px;
            box-shadow: 0 12px 26px rgba(10, 132, 255, 0.34), inset 0 1px rgba(255, 255, 255, 0.36);
        }

        .login-card h3 {
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 8px;
            letter-spacing: -0.045em;
        }

        .login-subtitle {
            text-align: center;
            color: #6e6e73;
            font-size: 0.92rem;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.86rem;
            color: #3a3a3c;
            margin-bottom: 7px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .form-control {
            border-radius: 12px;
            border: 1px solid rgba(60, 60, 67, 0.22);
            padding: 12px 14px;
            font-size: 0.95rem;
            transition: border-color 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
            background: rgba(255, 255, 255, 0.62);
        }

        .form-control:hover { border-color: rgba(60, 60, 67, 0.38); background: rgba(255, 255, 255, 0.85); }

        .form-control:focus {
            border-color: #0071e3;
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.16);
            background: rgba(255, 255, 255, 0.96);
            outline: none;
        }

        .btn-login {
            background: #0071e3;
            border: none;
            color: white;
            padding: 13px;
            border-radius: 12px;
            width: 100%;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            transition: transform 0.16s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s ease, background-color 0.2s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 16px rgba(0, 113, 227, 0.24);
        }

        .btn-login:hover {
            transform: translateY(-1px);
            background: #0077ed;
            box-shadow: 0 10px 22px rgba(0, 113, 227, 0.30);
            color: white;
        }

        .btn-login:active { transform: scale(0.98); }

        .btn-login.btn-loading {
            pointer-events: none;
            color: transparent;
        }

        .btn-login.btn-loading::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 20px; height: 20px;
            margin: -10px 0 0 -10px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .register-link { transition: all 0.2s ease; }
        .register-link:hover { color: #1d4ed8 !important; }

        .alert {
            border: none;
            border-radius: 10px;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        /* 背景光晕增强空间层次 */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            z-index: 0;
            filter: blur(2px);
            pointer-events: none;
        }
        body::before {
            width: 34rem; height: 34rem;
            background: rgba(255, 255, 255, 0.10);
            top: -14rem; right: -10rem;
        }
        body::after {
            width: 24rem; height: 24rem;
            background: rgba(255, 255, 255, 0.08);
            bottom: -10rem; left: -8rem;
        }

        .login-card { position: relative; z-index: 1; }

        @media (max-width: 480px) {
            body { padding: 16px; }
            .login-card { padding: 32px 24px; border-radius: 24px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .login-card, .btn-login, .alert { animation: none; transition: none; }
            .form-control { transition: none; }
        }

        @media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
            .login-card { background: #ffffff; backdrop-filter: none; -webkit-backdrop-filter: none; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-icon">
            <i class="fas fa-boxes"></i>
        </div>
        <h3 class="text-center">办公用品管理</h3>
        <p class="login-subtitle">库存出入库 · 审批流程</p>

        {% if form.errors %}
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>用户名或密码错误
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}" id="loginForm">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next|default:'/' }}">

            <div class="mb-3">
                <label for="id_username" class="form-label">
                    <i class="fas fa-user"></i> 用户名
                </label>
                <input type="text" name="username" id="id_username" class="form-control"
                       placeholder="请输入用户名" required autofocus>
            </div>

            <div class="mb-4">
                <label for="id_password" class="form-label">
                    <i class="fas fa-lock"></i> 密码
                </label>
                <input type="password" name="password" id="id_password" class="form-control"
                       placeholder="请输入密码" required>
            </div>

            <button type="submit" class="btn btn-login" id="loginBtn">
                <i class="fas fa-sign-in-alt me-2"></i>登录
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="{% url 'register' %}" class="text-decoration-none register-link" style="color:#2563eb;">
                没有账号？立即注册
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function() {
            var btn = document.getElementById('loginBtn');
            btn.classList.add('btn-loading');
            btn.disabled = true;
        });
    </script>
</body>
</html>
