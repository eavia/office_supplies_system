{% extends 'inventory/base.html' %}
{% block page_title %}个人信息{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-user me-2" style="color:#0075de;"></i>个人信息</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" class="form-control" value="{{ request.user.username }}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">角色</label>
                        <div><span class="badge bg-info">{{ profile.role_display }}</span></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">部门</label>
                        <input type="text" class="form-control" value="{{ profile.department|default:"未分配" }}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">姓名</label>
                        {{ form.name }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">手机号</label>
                        {{ form.phone }}
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>保存</button>
                    <a href="{% url 'profile_password' %}" class="btn btn-outline-warning ms-2"><i class="fas fa-key me-1"></i>修改密码</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
